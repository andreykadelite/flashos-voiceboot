search --no-floppy --file --set=root /flashos/flashos.marker
set timeout=0
set default=0
menuentry 'FlashOS voice menu' {
    set flashos_uuid=@DATA_UUID@
    linux /flashos/vmlinuz boot=live live-media=/dev/disk/by-uuid/$flashos_uuid live-media-path=/flashos nopersistence noeject quiet loglevel=3 console=ttyS0,115200 console=tty1
    initrd /flashos/initrd
}
