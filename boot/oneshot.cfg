# FlashOS: consume a request BEFORE loading the selected installer.
# Keep the state in a preallocated GRUB environment block, never execute it.
set VTOY_DEFAULT_IMAGE="F6>FlashOS"
set VTOY_MENU_TIMEOUT=1
unset flashos_next
set flashos_state=($vtoydev,3)/ventoy/flashos.env
if [ -f $flashos_state ]; then
    load_env --file=$flashos_state flashos_next
    if [ -n "$flashos_next" ]; then
        set flashos_requested="$flashos_next"
        unset flashos_next
        if save_env --file=$flashos_state flashos_next; then
            if [ -f "${vtoy_iso_part}${flashos_requested}" ]; then
                set VTOY_DEFAULT_IMAGE="$flashos_requested"
            fi
        fi
    fi
fi
if [ -f $vtoy_iso_part/ventoy/debug ]; then
    serial --unit=0 --speed=115200
    terminal_output --append serial
    echo "FLASHOS_GRUB requested=$flashos_requested default=$VTOY_DEFAULT_IMAGE"
fi
