set timeout=0
set default=0
menuentry 'FlashOS' {
    if [ "$grub_platform" = "efi" ]; then
        chainloader ($vtoydev,3)/flashos/efi/BOOTX64.EFI
        boot
    else
        probe --set=flashos_uuid --fs-uuid $vtoy_iso_part
        linux $vtoy_iso_part/flashos/vmlinuz boot=live live-media=/dev/disk/by-uuid/$flashos_uuid live-media-path=/flashos nopersistence noeject quiet loglevel=3 console=ttyS0,115200 console=tty1
        initrd $vtoy_iso_part/flashos/initrd
        boot
    fi
}
