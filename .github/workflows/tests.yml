name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==43.0.0
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - run: xvfb-run -a python -m unittest discover -s tests -v
      - run: python tools/check-publication.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.11.2
      - run: python -m unittest discover -s tests -p 'test_installer*.py' -v
